[pytest]
testpaths = .
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    serial: marks tests that must run in isolation
    auth: auth module tests
    users: users module tests
    customization: customization module tests
    tracking: tracking module tests
    reference: reference module tests
    prayer_times: prayer times module tests
    cross_cutting: cross-cutting concern tests
    health: health module tests
addopts = -v --tb=short
