openapi: 3.0.0
info:
  title: Muhasabah API
  version: 1.0.0
  description: >-
    Production-grade Node.js + Express REST API with TypeScript, Prisma, and
    PostgreSQL
  contact:
    name: API Support
    email: support@trackyrlife.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:3000/api
    description: Development server
  - url: https://track-your-life.onrender.com/api
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Enter your JWT token in the format: Bearer <token>'
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Validation failed
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        message:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
          example: clxxx123456789
        email:
          type: string
          format: email
          example: user@example.com
        firstName:
          type: string
          nullable: true
          example: John
        lastName:
          type: string
          nullable: true
          example: Doe
        isActive:
          type: boolean
          example: true
        emailVerified:
          type: boolean
          example: false
        emailVerifiedAt:
          type: string
          format: date-time
          nullable: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        passwordChangedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Tokens:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/Tokens'
    CustomizationItem:
      type: object
      properties:
        id:
          type: string
          example: clxxx123456789
        name:
          type: string
          example: Masjid
        isDefault:
          type: boolean
          example: true
        isActive:
          type: boolean
          example: true
        userId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
            total:
              type: integer
              example: 50
            page:
              type: integer
              example: 1
            totalPages:
              type: integer
              example: 3
            limit:
              type: integer
              example: 20
        message:
          type: string
tags:
  - name: Authentication
    description: User authentication and authorization endpoints
  - name: Users
    description: User profile and account management (protected)
  - name: Health
    description: Health check endpoints
  - name: Prayer Times
    description: Prayer times configuration and retrieval
  - name: Reference
    description: System reference data (read-only lookups)
  - name: Customization - Prayer Locations
    description: Manage prayer location options (system defaults + custom)
  - name: Customization - Other Prayer Types
    description: Manage other prayer type options (system defaults + custom)
  - name: Customization - Dhikr Types
    description: Manage dhikr type options (system defaults + custom)
  - name: Customization - Fasting Types
    description: Manage fasting type options (system defaults + custom)
  - name: Customization - Charity Types
    description: Manage charity type options (system defaults + custom)
  - name: Customization - Islamic Study Subjects
    description: Manage Islamic study subject options (system defaults + custom)
  - name: Customization - Study Modes
    description: Manage study mode options (system defaults + custom)
  - name: Customization - Fitness Activities
    description: Manage fitness activity options (system defaults + custom)
  - name: Customization - Nutrition Foods
    description: Manage nutrition food options (system defaults + custom)
  - name: Customization - Fitrah Practices
    description: Manage fitrah practice options (system defaults + custom)
  - name: Customization - Skills
    description: Manage user-owned skills and their topics
  - name: Customization - Intentions
    description: Manage user-owned intentions
  - name: Tracking - Daily Prayers
    description: Log and manage daily obligatory prayer records
  - name: Tracking - Other Prayers
    description: Log and manage voluntary/sunnah prayer records
  - name: Tracking - Quran
    description: Log and manage Quran reading/memorization records
  - name: Tracking - Dhikr
    description: Log and manage dhikr (remembrance) records
  - name: Tracking - Fasting
    description: Log and manage fasting records
  - name: Tracking - Charity
    description: Log and manage charity/sadaqah records
  - name: Tracking - Islamic Study
    description: Log and manage Islamic study session records
  - name: Tracking - Skill Progress
    description: Log and manage skill learning progress records
  - name: Tracking - Fitness
    description: Log and manage fitness/exercise records
  - name: Tracking - Nutrition
    description: Log and manage nutrition/food intake records
  - name: Tracking - Sleep
    description: Log and manage sleep records
  - name: Tracking - Fitrah Practices
    description: Log and manage fitrah (natural hygiene) practice records
  - name: Tracking - Tasks
    description: Log and manage daily task records
  - name: Tracking - Intentions
    description: Log and manage intention tracking records
paths:
  /v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Create a new user account and send email verification OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: SecurePass123
      responses:
        '201':
          description: User registered successfully, verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                        example: user@example.com
                      message:
                        type: string
                        example: >-
                          Registration successful. Please check your email for
                          verification code.
                  message:
                    type: string
                    example: User registered successfully
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/verify-email:
    post:
      tags:
        - Authentication
      summary: Verify email with OTP
      description: Verify user's email address using the OTP sent during registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                otp:
                  type: string
                  pattern: ^\d{6}$
                  example: '123456'
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AuthResponse'
                  message:
                    type: string
                    example: Email verified successfully
        '409':
          description: Email already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/resend-verification:
    post:
      tags:
        - Authentication
      summary: Resend email verification OTP
      description: Send a new verification OTP to the user's email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: Verification code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: >-
                          If the email exists and is not verified, a new
                          verification code has been sent.
                  message:
                    type: string
                    example: Verification code sent
        '409':
          description: Email already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate user and return tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: SecurePass123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AuthResponse'
                  message:
                    type: string
                    example: Login successful
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Initiate password reset
      description: Send password reset OTP to user's email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: Password reset code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: >-
                          If the email exists, a password reset code has been
                          sent.
  /v1/auth/resend-reset-otp:
    post:
      tags:
        - Authentication
      summary: Resend password reset OTP
      description: Send a new password reset OTP to the user's email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: Password reset code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: >-
                          If the email exists, a new password reset code has
                          been sent.
  /v1/auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password
      description: Reset user password with verified OTP and invalidate all sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
                - newPassword
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                otp:
                  type: string
                  pattern: ^\d{6}$
                  example: '123456'
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  example: NewSecurePass123
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: >-
                          Password reset successful. Please log in with your new
                          password.
        '422':
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: >-
        Use a valid refresh token to obtain new access and refresh tokens. The
        old refresh token is invalidated (token rotation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      refreshToken:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  message:
                    type: string
                    example: Token refreshed successfully
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Invalidate the provided refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /v1/auth/logout-all:
    post:
      tags:
        - Authentication
      summary: Logout from all devices
      description: Invalidate all refresh tokens for the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out from all devices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/session:
    get:
      tags:
        - Authentication
      summary: Get current session
      description: Validate current session token and return user authentication status
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session valid, user profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/delete-account/initiate:
    post:
      tags:
        - Authentication
      summary: Initiate account deletion
      description: Verify password and send OTP to confirm account deletion
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
                - confirmation
              properties:
                password:
                  type: string
                  format: password
                  example: CurrentPassword123
                confirmation:
                  type: string
                  example: DELETE
                  description: Must be exactly "DELETE" (case-sensitive)
      responses:
        '200':
          description: Account deletion initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: >-
                          Account deletion OTP sent to your email. Please verify
                          to complete deletion.
        '401':
          description: Unauthorized or invalid password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/delete-account/confirm:
    post:
      tags:
        - Authentication
      summary: Confirm account deletion
      description: Verify OTP and permanently delete user account with all data
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
              properties:
                otp:
                  type: string
                  pattern: ^\d{6}$
                  example: '123456'
      responses:
        '200':
          description: Account deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Account deleted successfully.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/customization/prayer-locations:
    get:
      tags:
        - Customization - Prayer Locations
      summary: List prayer locations
      description: Returns system defaults (isDefault=true) merged with user's custom items
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Prayer locations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomizationItem'
        '401':
          description: Unauthorized
    post:
      tags:
        - Customization - Prayer Locations
      summary: Create a custom prayer location
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: University Prayer Room
      responses:
        '201':
          description: Created successfully
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /v1/customization/prayer-locations/{id}:
    put:
      tags:
        - Customization - Prayer Locations
      summary: Update a custom prayer location
      description: Only user-created items can be updated. System defaults return 403.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
      responses:
        '200':
          description: Updated successfully
        '401':
          description: Unauthorized
        '403':
          description: Cannot modify system defaults
        '404':
          description: Not found
        '422':
          description: Validation error
    delete:
      tags:
        - Customization - Prayer Locations
      summary: Delete a custom prayer location
      description: >-
        Only user-created items can be deleted. Items referenced in tracking
        logs return 409.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Cannot delete system defaults
        '409':
          description: Item referenced in tracking logs
  /v1/customization/other-prayer-types:
    get:
      tags:
        - Customization - Other Prayer Types
      summary: List other prayer types
      description: >-
        Returns system defaults (Tahajjud, Duha, Witr, etc.) merged with user's
        custom types
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Other prayer types retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                          example: Tahajjud
                        requiresRakahCount:
                          type: boolean
                        isDefault:
                          type: boolean
                        isActive:
                          type: boolean
        '401':
          description: Unauthorized
    post:
      tags:
        - Customization - Other Prayer Types
      summary: Create a custom other prayer type
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - requiresRakahCount
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Istikhara
                requiresRakahCount:
                  type: boolean
                  example: true
      responses:
        '201':
          description: Created successfully
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /v1/customization/other-prayer-types/{id}:
    put:
      tags:
        - Customization - Other Prayer Types
      summary: Update a custom other prayer type
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                requiresRakahCount:
                  type: boolean
      responses:
        '200':
          description: Updated successfully
        '401':
          description: Unauthorized
        '403':
          description: Cannot modify system defaults
        '404':
          description: Not found
        '422':
          description: Validation error
    delete:
      tags:
        - Customization - Other Prayer Types
      summary: Delete a custom other prayer type
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Cannot delete system defaults
        '409':
          description: Item referenced in tracking logs
  /v1/customization/dhikr-types:
    get:
      tags:
        - Customization - Dhikr Types
      summary: List dhikr types
      description: Returns system defaults merged with user's custom dhikr types
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dhikr types retrieved
        '401':
          description: Unauthorized
    post:
      tags:
        - Customization - Dhikr Types
      summary: Create a custom dhikr type
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Istighfar
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /v1/customization/dhikr-types/{id}:
    put:
      tags:
        - Customization - Dhikr Types
      summary: Update a custom dhikr type
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
      responses:
        '200':
          description: Updated
        '401':
          description: Unauthorized
        '403':
          description: Cannot modify system defaults
        '404':
          description: Not found
        '422':
          description: Validation error
    delete:
      tags:
        - Customization - Dhikr Types
      summary: Delete a custom dhikr type
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
