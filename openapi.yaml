  /v1/users/profile:
    get:
      tags:
        - Users
      summary: Get current user profile
      description: Retrieve the authenticated user's profile information
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Users
      summary: Update user profile
      description: Update the authenticated user's profile information
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 50
                  pattern: ^[a-zA-Z\s-]+$
                  example: John Doe
                age:
                  type: integer
                  minimum: 6
                  maximum: 120
                  example: 25
                city:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: New York
                country:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: United States
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                  example: 40.7128
                  description: User's latitude for prayer times
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                  example: -74.006
                  description: User's longitude for prayer times
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
                  message:
                    type: string
                    example: Profile updated successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/users/onboarding:
    post:
      tags:
        - Users
      summary: Complete user onboarding
      description: Submit required profile information for first-time onboarding
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - displayName
                - age
                - city
                - country
              properties:
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 50
                  pattern: ^[a-zA-Z\s-]+$
                  example: John Doe
                age:
                  type: integer
                  minimum: 6
                  maximum: 120
                  example: 25
                city:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: New York
                country:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: United States
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                  example: 40.7128
                  description: User's latitude (optional, for prayer times)
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                  example: -74.006
                  description: User's longitude (optional, for prayer times)
      responses:
        '200':
          description: Onboarding completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
